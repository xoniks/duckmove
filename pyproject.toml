[project]
name = "duckmove"
version = "0.1.0"
# Kept ASCII on purpose: this string is printed by `pip show` and PyPI CLI
# tooling, which on a Windows cp1252 console renders an em dash as `?`.
description = "DuckDB-powered MCP server for spatial analysis and maps from CSVs, Excel, Parquet, and GeoJSON - built for data analysts"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Egezon Baruti", email = "egzonbaruti@gmail.com" }]
license = { text = "MIT" }
keywords = ["mcp", "duckdb", "spatial", "geospatial", "llm", "maps", "claude", "gis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  # Upper bounds: a breaking major release of any of these would otherwise
  # break every existing install on the next `pip install -U`.
  "mcp>=1.1.1,<2",
  "duckdb>=1.1,<2",
  "folium>=0.15,<1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/xoniks/duckmove"
Repository = "https://github.com/xoniks/duckmove"
Issues = "https://github.com/xoniks/duckmove/issues"

[project.scripts]
duckmove = "duckmove.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duckmove = ["py.typed"]

[tool.pytest.ini_options]
# `pythonpath` means `python -m pytest` works from a clean checkout with no
# editable install required.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:pkg_resources.*"]

[tool.coverage.run]
source = ["duckmove"]
branch = true

[tool.ruff]
line-length = 90
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # Field(...) in defaults is the documented FastMCP pattern
  # PEP 585/604 modernisation must stay off while we support Python 3.9.
  # `from __future__ import annotations` makes these safe for a type checker,
  # but Pydantic *evaluates* the annotation strings to build the MCP tool
  # schemas, and `str | None` raises TypeError at eval time on 3.9.
  "UP006",   # Dict -> dict
  "UP035",   # deprecated typing imports
  "UP045",   # Optional[X] -> X | None
  "RUF001",  # en dash / middle dot are intentional in user-facing strings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
# Runtime still supports 3.9, but mypy dropped 3.9 as a *target*; 3.10 is the
# lowest it will accept. Actual 3.9 compatibility is enforced by the CI matrix.
python_version = "3.10"
files = ["src/duckmove"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
